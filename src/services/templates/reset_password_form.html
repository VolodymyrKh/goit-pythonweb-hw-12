<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f4f6; color: #222; display: flex; justify-content: center; padding: 48px 16px; margin: 0; }
    form { background: #fff; padding: 24px; border-radius: 8px; width: 100%; max-width: 360px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
    h2 { margin-top: 0; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 16px; width: 100%; padding: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    #result { margin-top: 12px; font-size: 14px; }
    .error { color: #b91c1c; }
    .ok { color: #15803d; }
  </style>
</head>
<body>
  <form id="reset-form" data-token="{{ token }}" data-action="{{ action }}">
    <h2>Choose a new password</h2>
    <label for="password">New password</label>
    <input id="password" type="password" minlength="6" maxlength="128" required>
    <label for="confirm">Repeat new password</label>
    <input id="confirm" type="password" minlength="6" maxlength="128" required>
    <button type="submit">Reset password</button>
    <div id="result"></div>
  </form>
  <script>
    const form = document.getElementById("reset-form");
    const { token, action } = form.dataset;
    const result = document.getElementById("result");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      if (password !== document.getElementById("confirm").value) {
        result.className = "error";
        result.textContent = "Passwords do not match";
        return;
      }
      const response = await fetch(action, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: password }),
      });
      const data = await response.json();
      result.className = response.ok ? "ok" : "error";
      result.textContent = response.ok ? data.message : (typeof data.detail === "string" ? data.detail : "Invalid password");
      if (response.ok) form.querySelector("button").disabled = true;
    });
  </script>
</body>
</html>
