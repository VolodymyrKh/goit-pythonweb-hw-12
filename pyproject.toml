[project]
name = "goit-pythonweb-hw-10"
version = "0.2.0"
description = "REST API for managing contacts with JWT authentication (FastAPI + SQLAlchemy + PostgreSQL)"
authors = [
    { name = "Volodymyr", email = "volodymyr_kh@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cloudinary>=1.46.2",
    "fastapi>=0.141.1",
    "fastapi-mail>=1.6.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false
