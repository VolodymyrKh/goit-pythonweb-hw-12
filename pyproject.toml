[project]
name = "goit-pythonweb-hw-12"
version = "0.3.0"
description = "REST API for managing contacts with JWT authentication, roles and Redis caching (FastAPI + SQLAlchemy + PostgreSQL)"
authors = [
    { name = "Volodymyr", email = "volodymyr_kh@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cloudinary>=1.46.2",
    "fastapi>=0.141.1",
    "fastapi-mail>=1.6.8",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.38.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src", "main"]
# SQLAlchemy async runs queries in greenlets; without this coverage misses lines after awaits
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
include_namespace_packages = true
